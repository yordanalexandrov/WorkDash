name: Release

# A tag v* (from `npm version`) builds the desktop deb and attaches it to a draft release, published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    name: Desktop deb to a draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: The tag is the root's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm ci --prefix desktop --ignore-scripts
      - run: npm run build:deb
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "WorkDash $GITHUB_REF_NAME" desktop/release/*.deb
        env:
          GH_TOKEN: ${{ github.token }}
