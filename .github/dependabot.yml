version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The types follow the oldest Node the server supports (engines: >=22), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the tooling, one for what ships.
      dev:
        dependency-type: development
      runtime:
        dependency-type: production
  # The desktop app's own package (ADR 0002): Electron, and better-sqlite3 at the root's version.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
      runtime:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
