# Пример за настройките. Таблото ги пази в data директорията и ги сменя от екрана „Настройки“;
# този файл се копира там само при първия старт (виж README).

github:
  poll_interval: 60s

repos:
  - my-org/repo-a
  - my-org/repo-b

team:                          # чии PR-и да се виждат в секция "Екипът"
  - colleague1
  - colleague2

jira:
  base_url: https://example.atlassian.net/browse/
  project_keys: [ABC]          # празно = всякакъв ключ от вида ABC-123

review:
  required_approvals: 1        # ползва се, когато repo-то няма branch protection за review
  recently_closed_window: 24h  # колко дълго се виждат merged/closed PR-и

notifications:                 # false изключва типа; събитието пак се записва, но не се показва
  review_requested: true
  new_comment_on_my_pr: true
  review_on_my_pr: true
  ci_failed_on_my_pr: true
  my_pr_ready_to_merge: true
  mention: true
  re_review_needed: true
  team_pr_opened: true
  quiet_hours: "19:00-09:00"   # без нотификации; часът е в зоната от TZ (в .env). Пропуснатото идва обобщено после
