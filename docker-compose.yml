services:
  workdash:
    build: .
    image: workdash
    restart: unless-stopped
    # TZ, the port and, for the first start only, GITHUB_TOKEN; the settings and the token live in the volume.
    env_file: .env
    environment:
      # The zone notifications.quiet_hours are read in; set TZ in .env (e.g. America/New_York). Unset, the container runs in UTC.
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${WORKDASH_PORT:-3000}:3000"
    volumes:
      # Everything the dashboard keeps: config.yaml, the GitHub token and the database (docs/adr/0001).
      - workdash-data:/app/data

volumes:
  workdash-data:
